<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#10163a">
    <title>sound-kit 試聴</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="audition/style.css">
</head>
<body>
    <header class="top">
        <h1>sound-kit</h1>
        <p class="game">mine-blocks</p>
    </header>

    <nav class="tabs" role="tablist">
        <button class="tab is-active" data-tab="bgm" role="tab">BGM</button>
        <button class="tab" data-tab="effects" role="tab">効果音</button>
        <button class="tab" data-tab="instruments" role="tab">楽器</button>
    </nav>

    <main>
        <section class="panel is-active" id="bgm"></section>
        <section class="panel" id="effects">
            <div id="effect-list"></div>
        </section>
        <section class="panel" id="instruments"></section>
    </main>

    <footer class="volume">
        <label>BGM<input type="range" id="bgm-volume" min="0" max="2" step="0.05" value="1"></label>
        <label>効果音<input type="range" id="effects-volume" min="0" max="2" step="0.05" value="1"></label>
        <p class="note">音が出ないときは、iPhone の消音モードを確かめてください</p>
    </footer>

    <script src="src/sound-kit.js"></script>
    <script src="games/mine-blocks.js"></script>
    <script src="games/mine-blocks-legacy.js"></script>
    <script src="audition/instruments.js"></script>
    <script src="audition/app.js"></script>
</body>
</html>
